openapi: 3.0.0
info:
  title: "Momentum Links & Threads API (Refactored)"
  description: "비용 최적화를 위해 캐시 조회와 생성/분석 기능이 분리된 API 명세"
  version: "1.1.0"
servers:
  - url: "/api/v1"
paths:
  /threads:
    get:
      summary: "캐시된 인사이트 스레드 조회"
      description: "Supabase에 캐시된 사용자의 최신 스레드 데이터를 즉시 반환합니다. 빠르고 비용이 들지 않는 읽기 전용 작업입니다."
      security:
        - bearerAuth: []
      tags:
        - Links & Threads
      responses:
        '200':
          description: "캐시 조회 성공"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CachedThreadsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /threads/generate:
    post:
      summary: "새로운 인사이트 스레드 분석 및 생성 (비용 발생)"
      description: "사용자의 모든 노트를 분석하여 새로운 인사이트 스레드를 생성하고, 그 결과를 캐시에 저장(Upsert)합니다. 계산과 Gemini API 호출로 인해 시간이 걸리고 비용이 발생하는 작업입니다."
      security:
        - bearerAuth: []
      tags:
        - Links & Threads
      requestBody:
        description: "분석에 사용할 가중치 값들"
        content:
          application/json:
            schema:
              type: object
              properties:
                citation_weight:
                  type: number
                  default: 1.0
                sim_weight:
                  type: number
                  default: 0.6
                tag_weight:
                  type: number
                  default: 0.2
      responses:
        '200':
          description: "분석 및 캐시 저장 성공"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsightThreadArray'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

# ... (connections, backlinks 등 다른 엔드포인트는 동일) ...

components:
  schemas:
    # ... (Note, InsightThread 등 기존 스키마는 동일) ...
    InsightThreadArray:
      type: "array"
      items:
        $ref: "#/components/schemas/InsightThread"
    CachedThreadsResponse:
      type: object
      properties:
        threads_data:
          $ref: '#/components/schemas/InsightThreadArray'
        last_updated_at:
          type: string
          format: date-time
# ... (이하 나머지 명세 동일) ...
