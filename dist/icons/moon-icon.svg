<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base gradient for the moon -->
    <radialGradient id="moonBaseGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEA" />
      <stop offset="80%" stop-color="#FFF3C4" />
      <stop offset="100%" stop-color="#FBEAAB" />
    </radialGradient>

    <!-- A secondary gradient for texture layer -->
    <radialGradient id="textureGradient" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFDE8" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for the outer glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Main moon body -->
    <circle cx="50" cy="50" r="35" fill="url(#moonBaseGradient)" />

    <!-- Large, soft texture overlay -->
    <circle cx="50" cy="50" r="35" fill="url(#textureGradient)" opacity="0.5" />

    <!-- Artistic craters and seas (using paths for irregular shapes) -->
    <path d="M 40 65 A 15 20 0 0 0 60 70 A 18 15 0 0 1 40 65 Z" fill="#FBEAAB" opacity="0.4" />
    <path d="M 65 30 A 12 18 0 0 1 70 50 A 15 15 0 0 0 65 30 Z" fill="#FBEAAB" opacity="0.3" />

    <!-- Small, distinct craters -->
    <circle cx="38" cy="35" r="4" fill="#FFFFFF" opacity="0.3" />
    <circle cx="68" cy="58" r="2.5" fill="#FFFFFF" opacity="0.25" />
    <circle cx="55" cy="65" r="2" fill="#FFFFFF" opacity="0.3" />
  </g>
</svg>
