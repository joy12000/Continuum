<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Warm radial gradient for the moon body -->
    <radialGradient id="moonGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFDE8; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFF3C4; stop-opacity:1" />
    </radialGradient>

    <!-- Filter for the warm, gentle glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- The moon body with gradient and glow -->
  <circle cx="50" cy="50" r="35" fill="url(#moonGradient)" filter="url(#glow)" />

  <!-- Stylized, soft craters for an artistic touch -->
  <circle cx="40" cy="45" r="8" fill="#FFFDE8" opacity="0.5" />
  <circle cx="65" cy="60" r="5" fill="#FFFDE8" opacity="0.4" />
  <circle cx="55" cy="35" r="4" fill="#FFFDE8" opacity="0.6" />
</svg>
